# Build, sign and publish a hardened image, then scan what was actually
# published.
#
# Called by every image repo's .github/workflows/release.yml on push to main.
name: image release

on:
  workflow_call:
    inputs:
      version-arg:
        description: >-
          Dockerfile ARG holding the version, for images built from a source
          release rather than from somebody else's image. Mutually exclusive
          with version-from.
        type: string
        required: false
        default: ""
      version-from:
        description: >-
          Upstream image whose tag defines this image's version. The published
          tags track upstream, so iron-alpine built on alpine 3.24.1 publishes
          3.24.1, 3.24 and 3.
        type: string
        required: false
        default: ""
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      context:
        type: string
        required: false
        default: "."
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
      release:
        description: Cut a GitHub release for a version that does not have one.
        type: boolean
        required: false
        default: true
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: write        # tags and releases
  packages: write        # push to GHCR
  id-token: write        # cosign keyless signing
  security-events: write # SARIF upload

# Two pushes to main must not race each other onto the same tag.
concurrency:
  group: image-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version and tags
        id: version
        uses: irondragonservices/.github/actions/image-version@3ab64c35ed5d357c0b1285e23060035440a8d8e6 # main
        with:
          version-from: ${{ inputs.version-from }}
          version-arg: ${{ inputs.version-arg }}
          dockerfile: ${{ inputs.dockerfile }}
          image: ghcr.io/${{ github.repository }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          # A hardened image that cannot say what is inside it is not much use
          # to whoever has to answer for it later.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's OIDC identity, so
      # there is no key to leak or rotate. Verify with
      #   cosign verify ghcr.io/<repo>@<digest> \
      #     --certificate-identity-regexp '^https://github.com/irondragonservices/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the manifest
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # The pull request scanned a locally built image. This scans the artefact
      # that consumers will actually pull, by digest.
      - name: Scan the published image
        uses: irondragonservices/.github/actions/dragon-scan@3ab64c35ed5d357c0b1285e23060035440a8d8e6 # main
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          fail-on: ""

      - name: Upload SARIF
        # Code scanning on a private repository needs GitHub Advanced
        # Security. Its absence must not fail a release that succeeded.
        continue-on-error: true
        if: always() && hashFiles('dragon.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: dragon.sarif
          category: image

      - name: Cut a release for a new version
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Republishing an unchanged version is routine here: a scheduled
          # rebuild picks up patched packages without the upstream tag moving.
          # The release marks the version, so it is cut once.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; image tags were refreshed in place."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "$(printf '%s\n' \
              "Hardened image built on \`${{ inputs.version-from }}:${VERSION}\`." \
              "" \
              '```' \
              "docker pull ${IMAGE}:${VERSION}" \
              '```' \
              "" \
              "Digest: \`${DIGEST}\`" \
              "" \
              "Signed with cosign (keyless). Verify:" \
              '```' \
              "cosign verify ${IMAGE}@${DIGEST} \\" \
              "  --certificate-identity-regexp '^https://github.com/${{ github.repository_owner }}/' \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" \
              '```')"

name: DragonGuard image scan
description: Scan a container image with DragonGuard and emit SARIF.

# DragonGuard is the unifying layer: it normalises what Trivy and the other
# engines find into one schema, scores each finding against the asset's
# context, and gates on a baseline rather than on a raw severity count.
#
# It is public and has no release yet, so it is built from source here, pinned
# to a commit rather than tracking main — for the same reason the Trivy version
# is pinned. A scanner that changes underneath you changes every verdict it
# produces, and a gate that moves on its own is not a gate.
#
# There is no fallback engine. A scan that could not run is not the same thing
# as a scan that found nothing, so failing to build or run DragonGuard fails the
# step rather than quietly degrading to something weaker.

inputs:
  image:
    description: Image reference to scan, including the tag or digest.
    required: true
  image-source:
    description: >-
      Where Trivy should look for the image: "docker" for one built in this job
      and loaded into the local daemon, "remote" for one already in a registry.

      Not cosmetic. DragonGuard passes --image-src remote to Trivy
      unconditionally, so scanning a locally built image without overriding this
      fails with UNAUTHORIZED against docker.io — the local daemon is never
      consulted. The override rides in on engines.trivy.args, which DragonGuard
      appends after its own flags.
    required: false
    default: remote
  fail-on:
    description: >-
      Block at or above this rating. Empty means report without failing, which
      is what a scheduled re-scan of an already-published image wants.
    required: false
    default: ""
  sarif-output:
    required: false
    default: dragon.sarif
  markdown-output:
    required: false
    default: dragon.md
  dragonguard-repository:
    required: false
    default: DragonSecurity/dragonguard
  dragonguard-ref:
    description: >-
      Commit of DragonGuard to build. Swap this for a tag once one exists, or
      drop the build entirely once it publishes a binary — this file is the only
      place it is named.
    required: false
    default: "725de6b2e4cfae0ac96fa7833e4767b333714078"
  trivy-version:
    description: >-
      Pinned, because a scanner that changes underneath you changes every
      verdict it produces. DragonGuard shells out to Trivy for container
      targets.
    required: false
    default: "0.74.0"

outputs:
  sarif:
    description: Path to the SARIF report.
    value: ${{ inputs.sarif-output }}
  markdown:
    description: Path to the human-readable report.
    value: ${{ inputs.markdown-output }}

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${{ inputs.trivy-version }}/trivy_${{ inputs.trivy-version }}_Linux-64bit.tar.gz" \
          | sudo tar -xz -C /usr/local/bin trivy
        trivy --version

    - name: Check out DragonGuard
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.dragonguard-repository }}
        ref: ${{ inputs.dragonguard-ref }}
        path: .dragonguard-src

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: .dragonguard-src/go.mod
        cache-dependency-path: .dragonguard-src/go.sum

    - name: Build DragonGuard
      shell: bash
      run: |
        set -euo pipefail
        cd .dragonguard-src
        go build -o "$RUNNER_TEMP/dragon" ./cmd/dragon

    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IMAGE_SOURCE: ${{ inputs.image-source }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_OUT: ${{ inputs.sarif-output }}
        MD_OUT: ${{ inputs.markdown-output }}
      run: |
        set -euo pipefail

        # A repository carrying its own .dragon.yaml keeps its asset context,
        # which every risk score is calculated against. One that does not gets a
        # base-image default. Getting the context wrong changes every score, so
        # the repository's own file always wins.
        if [ ! -f .dragon.yaml ]; then
          echo "::notice::no .dragon.yaml here; using the base-image default asset context"
          cat > .dragon.yaml <<CFG
        version: dragonguard/v1
        project: image
        asset:
          name: image
          environment: production
          criticality: high
          internet_exposed: false
        engines:
          trivy:
            enabled: true
            args: ["--image-src", "${IMAGE_SOURCE}"]
        CFG
        fi

        # Produce the artefacts first, then gate. Reporting the findings matters
        # even when — especially when — the gate blocks.
        "$RUNNER_TEMP/dragon" scan container --image "$IMAGE" --quiet --format sarif    --output "$SARIF_OUT" || true
        "$RUNNER_TEMP/dragon" scan container --image "$IMAGE" --quiet --format markdown --output "$MD_OUT"    || true

        set +e
        if [ -n "$FAIL_ON" ]; then
          "$RUNNER_TEMP/dragon" scan container --image "$IMAGE" --no-color --fail-on "$FAIL_ON" | tee dragon.txt
        else
          "$RUNNER_TEMP/dragon" scan container --image "$IMAGE" --no-color | tee dragon.txt
        fi
        rc=${PIPESTATUS[0]}
        set -e

        # DragonGuard exits 0 when its only engine failed outright. Its README
        # says exit 2 for a scan that could not complete, and its own baseline
        # prints "!! complete evidence ... degraded" — so it knows; the verdict
        # just does not reach the exit status. Until that is fixed, a green
        # check here would mean "nothing looked at this image", which is worse
        # than having no check at all.
        if grep -qE "scan was degraded|engines failed" dragon.txt; then
          echo "::error::the scan did not complete; a degraded scan is treated as a failure, not a pass"
          sed -n '/Evidence/,$p' dragon.txt
          exit 1
        fi

        exit "$rc"
